name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Focused verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run focused test suite
        run: python -m pytest -q

      - name: Compile application modules
        run: python -m compileall -q src tests eval

      - name: Validate fixed evaluation scenarios
        run: python -m eval.run_eval
